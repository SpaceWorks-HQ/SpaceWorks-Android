name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && format('full-{0}', github.run_id) || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - run: chmod +x gradlew
      - run: ./gradlew lint test assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Verify native library and APK 16 KB alignment
        run: |
          # Generator-template tests run in :app:verifyNativeTemplates with Gradle's exact JAR.
          python3 -m unittest discover -s scripts/tests -p 'test_native_packaging.py' -v
          python3 scripts/check_native_packaging.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug
            app/build/outputs/apk/release
            app/build/outputs/bundle/release
            validation/native-packaging.json
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["compact","small-phone","phone","large","tablet","tablet-landscape","large-tablet"]' || '["phone","tablet"]') }}
    name: UI (${{ matrix.device }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ contains(matrix.device, 'tablet') && 'pixel_tablet' || 'pixel_6' }}
          script: bash scripts/device-matrix.sh ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-${{ matrix.device }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/connected_android_test_additional_output
            validation/${{ matrix.device }}
